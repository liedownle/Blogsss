---
layout: default
---
<article class="post">
  <h1 class="post-title">
    {% if page.encrypted %}<span class="lock-icon">🔒</span>{% endif %}
    {{ page.title }}
  </h1>
  <p class="post-meta">
    <time>{{ page.date | date: "%Y-%m-%d" }}</time>
    {% if page.encrypted %} · <span class="badge">加密文章</span>{% endif %}
  </p>

  <div class="post-content">
    {% if page.encrypted %}
      <!-- 加密博文：正文会在构建时被脚本加密替换 -->
      <div id="encrypt-prompt">
        <p>🔒 这篇文章已加密，请输入密码查看。</p>
        <input type="password" id="encrypt-input" placeholder="请输入密码" autocomplete="off">
        <button id="encrypt-submit">解锁</button>
        <p id="encrypt-error" style="color:#c00; display:none;">密码错误，请重试。</p>
      </div>
      <div id="encrypt-body" style="display:none;">
        <!-- ENCRYPT:START -->
        {{ content }}
        <!-- ENCRYPT:END -->
      </div>
    {% else %}
      {{ content }}
    {% endif %}
  </div>
</article>

{% if page.encrypted %}
<script src="{{ '/assets/js/encrypt.js' | relative_url }}"></script>
{% endif %}
